# Readings transcribed from the evidence records, as test fixtures for anything that decodes or
# shows these messages. Telegram bytes and decoded values only; nothing site-specific.
#
# Each reading cites the record it was copied from; scripts/metadata.py fixtures checks that the
# bytes are in that record, that the read ID and the written register are those of the
# definition, and that the two value bytes decode to `expect`. It writes the JSON file that
# scripts/release.sh puts beside the archives.
#
# read    ID bytes of the 50 22 request (checksum, address), when the record has a single read
# answer  the two data bytes answered
# write   data of the captured 50 23 telegram: checksum, address, value
# expect  decoded value per field
#
# So far: the 17 settings of evidence/settings-writes.md (table "write seen / read seen /
# decoded"). The other records quote their telegrams in prose or in tables of their own; they
# are not transcribed yet.

