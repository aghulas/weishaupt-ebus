# Fixtures: telegrams the evidence records hold, with the value each decodes to.
#
# A transcription, nothing else. Every reading names the record it was copied from (evidence)
# and the day of the capture (date), and carries the bytes as the record has them. No reading
# is invented, completed or "typical"; a register nobody recorded has no reading here until it
# is read and the reading is written into its record first.
#
# scripts/fixtures.py check (step 7 of scripts/check.sh) verifies each reading: the message
# exists, the bytes and the day are in the record, the request is the one of the definition,
# and ebusd itself, loaded with the compiled lot files and fed with the telegram, takes it for
# this message and decodes it to `expect`. scripts/fixtures.py build writes the fixtures file
# of a release (format: docs/companion-contract.md, "Fixtures").
#
# A block gives what its readings share:
#   evidence  record under evidence/, without .md
#   date      day of the capture
#   circuit   circuit of the messages (last part of the CSV file name; broadcast)
#   type      read (default): 50 22 register read or 50 00 memory read, request and answer
#             write: captured 50 23 telegram, acknowledged
#             passive: telegram between other devices, seen by ebusd
#   qq        source address of the telegram (default 31, ebusd, for a read)
#   where     row: request and answer stand on one line of the record (a table row)
#             text (default): each stands somewhere in the record
# A reading:
#   message   name of the message
#   master    data bytes the source sent, after the length byte: for a read the ID of the
#             definition (checksum, address); for a write checksum, address, value
#   slave     data bytes of the answer, after the length byte; "" for an acknowledged write;
#             absent when the target is a master or the telegram a broadcast
#   expect    value per field, as the record states it, at the precision of the record;
#             "-" is the replacement value (not available). Fields the record does not
#             state are left out: ebusd's reading of all fields goes into the built file.
#   error     in place of expect: ebusd refuses this telegram with the definitions as they
#             are, with this error. A known defect, kept so that it cannot go unnoticed.
#             No reading carries one since the correction of HcMode (release 0.5.0).
#   case      what the reading is an example of: first-byte-not-zero, not-available,
#             no-sensor, refused
#   note      a remark for the reader of the built file

schema = 2

